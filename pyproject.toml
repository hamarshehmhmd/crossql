[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crossql"
version = "0.1.0"
description = "Join tables across Postgres, MySQL, SQLite, DuckDB and CSV/Parquet files with one SQL query, and snapshot the results into a file Metabase or Superset can read. No warehouse."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Mohammad Hamarsheh"}]
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "tomli>=1.1; python_version < '3.11'"]
keywords = ["sql", "duckdb", "federated-query", "cross-database", "join", "postgres", "mysql", "sqlite", "metabase", "analytics"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/hamarshehmhmd/crossql"
Issues = "https://github.com/hamarshehmhmd/crossql/issues"

[project.scripts]
crossql = "crossql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
